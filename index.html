<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Custom Invites</title>

<!-- Load Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Bebas+Neue&family=Cormorant+Garamond:wght@600&family=Great+Vibes&family=Parisienne&family=Dancing+Script:wght@600&family=Alex+Brush&family=Tangerine:wght@700&family=Cinzel:wght@600&family=Lora:ital,wght@0,600;1,600&family=Montserrat:wght@500&family=Sacramento&family=Pinyon+Script&family=Crimson+Text:wght@600&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<!-- Load html2canvas -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<!-- Load PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    font-family: 'Poppins', Arial, sans-serif;
    background: #0f172a;
    display: flex;
    flex-direction: column;
    position: relative;
    color: #333;
}

/* ==================== ANIMATED BACKGROUND ==================== */
.animated-bg {
    position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
}
.animated-bg::before {
    content: ""; position: absolute; inset: -50%;
    background: linear-gradient(135deg, #0463c9, #09a7e6, #6a5acd, #fc4964, #f59e0b, #10b981, #0463c9);
    background-size: 400% 400%; animation: gradientShift 18s ease infinite; opacity: 0.9;
}
@keyframes gradientShift {
    0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; }
}
.animated-bg::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, rgba(15, 23, 42, 0.10) 0%, rgba(15, 23, 42, 0.55) 100%);
}
.animated-bg .blob {
    position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.55;
    animation: floatBlob 20s ease-in-out infinite; will-change: transform;
}
.animated-bg .b1 { width: 480px; height: 480px; background: radial-gradient(circle, #09a7e6, transparent 70%); top: -180px; left: -160px; animation-duration: 22s; }
.animated-bg .b2 { width: 420px; height: 420px; background: radial-gradient(circle, #fc4964, transparent 70%); bottom: -160px; right: -140px; animation-duration: 26s; animation-delay: -5s; }
@keyframes floatBlob {
    0%, 100% { transform: translate(0, 0) scale(1); }
    25% { transform: translate(50px, -40px) scale(1.08); }
    50% { transform: translate(-30px, 50px) scale(0.94); }
    75% { transform: translate(40px, 30px) scale(1.05); }
}

/* ==================== LAYOUT ==================== */
.app-wrapper {
    position: relative; z-index: 1; display: flex; flex-direction: column;
    max-width: 1100px; width: 100%; margin: 0 auto; padding: 20px;
}

/* ==================== HEADER ==================== */
.header { text-align: center; margin-bottom: 25px; }
.header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 38px; 
    color: #ffffff;
    margin: 0 0 8px 0; 
    font-weight: 700; 
    letter-spacing: 1px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.3);
}
.header p {
    font-family: 'Poppins', sans-serif;
    font-size: 12px;
    color: rgba(255,255,255,0.85);
    margin: 0;
    letter-spacing: 2px;
    text-transform: uppercase;
}

/* ==================== PREVIEW (STICKY ON MOBILE) ==================== */
.preview-panel {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(20px); border-radius: 16px; padding: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2); margin-bottom: 20px;
    display: flex; justify-content: center;
    position: sticky; top: 10px; z-index: 50;
}
.card-wrapper {
    position: relative; width: 100%; max-width: 300px; 
    overflow: hidden; background: white; border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}
.card-wrapper img { display: block; width: 100%; height: auto; }
.name-overlay {
    position: absolute; left: 50%; transform: translateX(-50%);
    max-width: 95%; display: none; text-align: center; white-space: nowrap;
    line-height: 1.2; font-family: 'Cormorant Garamond', serif; font-weight: 600;
    color: #3a2c24; text-shadow: 0 0 6px rgba(255,255,255,.9); pointer-events: none;
}

/* ==================== EDITOR PANEL ==================== */
.editor-panel {
    background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px);
    border-radius: 16px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    display: flex; flex-direction: column; gap: 15px;
}

h2 { margin: 0; padding-bottom: 10px; border-bottom: 2px solid #eee; color: #1e293b; font-size: 18px; }
.form-group { display: flex; flex-direction: column; gap: 6px; }
label { font-size: 13px; font-weight: 600; color: #475569; }

input[type="text"], select, textarea {
    width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px;
    font-size: 16px; background: #f8fafc; font-family: inherit;
}
input[type="text"]:focus, select:focus, textarea:focus { outline: none; border-color: #0463c9; background: #fff; }

textarea { resize: vertical; min-height: 80px; }
input[type="range"] { width: 100%; cursor: pointer; accent-color: #0463c9; height: 30px; }
input[type="color"] { width: 100%; height: 45px; padding: 4px; border: 1px solid #cbd5e1; border-radius: 8px; cursor: pointer; background: #fff;}

.row { display: flex; gap: 10px; }
.row .form-group { flex: 1; min-width: 0; }
.value { color: #0463c9; font-weight: bold; }

.upload-box {
    border: 2px dashed #94a3b8; padding: 20px; text-align: center; border-radius: 8px;
    cursor: pointer; background: #f8fafc; transition: 0.2s; color: #475569; display: block;
}
.upload-box:hover { border-color: #0463c9; background: #fff; color: #0463c9; }
.upload-box input[type="file"] { display: none; }

.buttons { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
button {
    width: 100%; padding: 15px; border: none; border-radius: 8px;
    background: #1e293b; color: white; font-size: 16px; font-weight: 600;
    cursor: pointer; transition: 0.2s;
}
button:hover { background: #0f172a; }
button:disabled { opacity: .6; cursor: wait; }

.batch-box { background: #f1f5f9; border: 2px dashed #cbd5e1; padding: 15px; border-radius: 8px; margin-top: 10px; }
.batch-box h3 { margin: 0 0 10px 0; font-size: 16px; color: #0463c9; }

#status { margin: 0; font-size: 14px; text-align: center; color: #b42318; font-weight: bold; min-height: 20px; }
.footer { text-align: center; padding: 20px 0; color: rgba(255,255,255,0.8); font-size: 13px; letter-spacing: 1px; }

/* ==================== DESKTOP (SIDE BY SIDE) ==================== */
@media (min-width: 800px) {
    .app-wrapper { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; align-items: start; }
    .header { grid-column: 1 / -1; margin-bottom: 0; }
    .preview-panel { position: static; grid-column: 2; grid-row: 2; padding: 30px; }
    .card-wrapper { max-width: 100%; }
    .editor-panel { grid-column: 1; grid-row: 2; }
    .footer { grid-column: 1 / -1; }
    .header h1 { font-size: 48px; }
}
</style>
</head>
<body>

<div class="animated-bg">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
</div>

<div class="app-wrapper">
    
    <div class="header">
        <h1>Custom Invites</h1>
        <p>Create beautiful personalized invitations</p>
    </div>

    <!-- STICKY PREVIEW (Mobile stays at top) -->
    <section class="preview-panel">
        <div class="card-wrapper" id="cardWrapper">
            <img id="invitationImg" src="" alt="Upload file" style="display:none;">
            <div id="placeholder" style="padding: 40px 10px; text-align: center; color: #888;">
                <h3 style="margin:0 0 5px 0; font-size:16px;">No Image</h3>
                <p style="margin:0; font-size:12px;">Upload a file below</p>
            </div>
            <div class="name-overlay" id="nameOverlay"></div>
        </div>
    </section>

    <!-- EDITOR -->
    <section class="editor-panel">
        <h2>⚙️ Design & Preview</h2>

        <div class="form-group">
            <label class="upload-box" for="imageUpload">
                📁 <strong>Upload PDF or Image</strong>
                <input type="file" id="imageUpload" accept="application/pdf, image/png, image/jpeg">
            </label>
        </div>

        <div class="form-group">
            <label>Preview Name</label>
            <input type="text" id="guestName"  placeholder="Type to preview" autocomplete="off">
        </div>

        <div class="row">
            <div class="form-group">
                <label>Pos <span class="value" id="posValue">41.5%</span></label>
                <input type="range" id="posSlider" min="5" max="95" step="0.5" value="41.5">
            </div>
            <div class="form-group">
                <label>Size <span class="value" id="sizeValue">5%</span></label>
                <input type="range" id="sizeSlider" min="2" max="12" step="0.5" value="5">
            </div>
            <div class="form-group" style="flex: 0 0 60px;">
                <label>Color</label>
                <input type="color" id="colorPicker" value="#3a2c24">
            </div>
        </div>

        <div class="form-group">
            <label>Font Style</label>
            <select id="fontSelect">
                <option value="'Cormorant Garamond', serif">Cormorant Garamond</option>
                <option value="'Great Vibes', cursive">Great Vibes</option>
                <option value="'Playfair Display', serif">Playfair Display</option>
                <option value="'Cinzel', serif">Cinzel</option>
                <option value="'Lora', serif">Lora</option>
                <option value="'Crimson Text', serif">Crimson Text</option>
                <option value="'Parisienne', cursive">Parisienne</option>
                <option value="'Alex Brush', cursive">Alex Brush</option>
                <option value="'Pinyon Script', cursive">Pinyon Script</option>
                <option value="'Tangerine', cursive">Tangerine</option>
                <option value="'Sacramento', cursive">Sacramento</option>
                <option value="'Dancing Script', cursive">Dancing Script</option>
                <option value="'Montserrat', sans-serif">Montserrat</option>
                <option value="'Bebas Neue', sans-serif">Bebas Neue (Chicago)</option>
            </select>
        </div>

        <div class="buttons" style="margin-top: 10px;">
            <button type="button" id="downloadBtn">⬇️ Download Single Image</button>
        </div>

        <p id="status" role="status"></p>

        <!-- BATCH MODE -->
        <div class="batch-box">
            <h3>✨ Batch Mode (Auto-Generate)</h3>
            <p style="font-size: 12px; color: #555; margin-top: 0;">The designs above will be applied to all names below.</p>
            <div class="form-group">
                <label>Paste Names (One per line)</label>
                <textarea id="batchNames" placeholder="Mr. & Mrs. Smith&#10;Dr. John Doe&#10;The Johnson Family"></textarea>
            </div>
            <div class="buttons">
                <button type="button" id="downloadAllBtn" style="background: #8b5a2b;">⬇️ Auto-Save All</button>
            </div>
        </div>
    </section>

    <footer class="footer">
        Developed by JRS
    </footer>
</div>

<script>
// Set PDF.js worker path
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

(() => {
    const imageUploadInput = document.getElementById('imageUpload');
    const guestNameInput = document.getElementById('guestName');
    const posSlider = document.getElementById('posSlider');
    const sizeSlider = document.getElementById('sizeSlider');
    const colorPicker = document.getElementById('colorPicker');
    const fontSelect = document.getElementById('fontSelect');
    const batchNamesInput = document.getElementById('batchNames');

    const nameOverlay = document.getElementById('nameOverlay');
    const cardWrapper = document.getElementById('cardWrapper');
    const invitationImg = document.getElementById('invitationImg');
    const placeholder = document.getElementById('placeholder');

    const downloadBtn = document.getElementById('downloadBtn');
    const downloadAllBtn = document.getElementById('downloadAllBtn');
    const status = document.getElementById('status');

    let currentImageSrc = null;

    function showStatus(message, error = true) {
        status.textContent = message;
        status.style.color = error ? '#b42318' : '#10b981';
        setTimeout(() => { if(status.textContent === message) status.textContent = ''; }, 4000);
    }

    // 1. Upload & PDF Conversion
    imageUploadInput.addEventListener('change', async function(e) {
        const file = e.target.files[0];
        if (!file) return;

        if (file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = function(event) { loadImage(event.target.result); };
            reader.readAsDataURL(file);
        } 
        else if (file.type === 'application/pdf') {
            showStatus('Converting PDF... Please wait.', false);
            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
                const page = await pdf.getPage(1); 
                const viewport = page.getViewport({ scale: 2.0 }); 
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                await page.render({ canvasContext: context, viewport: viewport }).promise;
                loadImage(canvas.toDataURL('image/png'));
                showStatus('PDF converted!', false);
            } catch (err) {
                showStatus('Error reading PDF. Try an image.', true);
            }
        }
    });

    function loadImage(src) {
        currentImageSrc = src;
        invitationImg.src = currentImageSrc;
        invitationImg.style.display = 'block';
        placeholder.style.display = 'none';
        updatePreview(guestNameInput.value);
    }

    // 2. Update Preview
    function updatePreview(nameToDisplay) {
        document.getElementById('posValue').textContent = posSlider.value + '%';
        document.getElementById('sizeValue').textContent = sizeSlider.value + '%';

        nameOverlay.style.top = posSlider.value + '%';
        nameOverlay.style.color = colorPicker.value;
        nameOverlay.style.fontFamily = fontSelect.value;

        if (!nameToDisplay || !nameToDisplay.trim()) {
            nameOverlay.style.display = 'none';
            return;
        }

        nameOverlay.textContent = nameToDisplay.trim(); 
        nameOverlay.style.display = 'block';

        const cardWidth = cardWrapper.clientWidth;
        if (!cardWidth) return;

        let fontSize = Math.max(10, cardWidth * Number(sizeSlider.value) / 100);
        const maxWidth = cardWidth * 0.88;

        nameOverlay.style.fontSize = fontSize + 'px';

        let attempts = 0;
        while (nameOverlay.scrollWidth > maxWidth && fontSize > 10 && attempts < 100) {
            fontSize -= 1;
            nameOverlay.style.fontSize = fontSize + 'px';
            attempts++;
        }
    }

    guestNameInput.addEventListener('input', () => updatePreview(guestNameInput.value));
    posSlider.addEventListener('input', () => updatePreview(guestNameInput.value));
    sizeSlider.addEventListener('input', () => updatePreview(guestNameInput.value));
    colorPicker.addEventListener('input', () => updatePreview(guestNameInput.value));
    fontSelect.addEventListener('change', () => updatePreview(guestNameInput.value));
    
    if (document.fonts) {
        document.fonts.ready.then(() => updatePreview(guestNameInput.value));
    }

    // 3. Generate Image
    async function generateBlob(name) {
        updatePreview(name);
        await new Promise(r => setTimeout(r, 150)); 
        
        const canvas = await html2canvas(cardWrapper, {
            scale: 3, 
            useCORS: true,
            backgroundColor: '#ffffff',
            logging: false
        });

        return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
    }

    function saveBlob(blob, filename) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1500);
    }

    // 4. Single Download
    downloadBtn.addEventListener('click', async () => {
        if (!currentImageSrc) return showStatus('Please upload a file first.');
        const name = guestNameInput.value.trim();
        if (!name) return showStatus('Please enter a guest name.');

        downloadBtn.disabled = true;
        downloadBtn.textContent = '⏳ Generating...';
        try {
            const blob = await generateBlob(name);
            saveBlob(blob, `Invitation-${name.replace(/[^a-z0-9]/gi, '-')}.png`);
            showStatus('Downloaded successfully!', false);
        } catch (err) {
            showStatus('Download failed.');
        } finally {
            downloadBtn.disabled = false;
            downloadBtn.textContent = '⬇️ Download Single Image';
            updatePreview(guestNameInput.value);
        }
    });

    // 5. Batch Process (Auto-Save All)
    downloadAllBtn.addEventListener('click', async () => {
        const names = batchNamesInput.value.split('\n').map(n => n.trim()).filter(n => n);
        if (!currentImageSrc) return showStatus('Please upload a file first.');
        if (names.length === 0) return showStatus('Please paste at least one name.');

        downloadAllBtn.disabled = true;
        try {
            for (let i = 0; i < names.length; i++) {
                downloadAllBtn.textContent = `⏳ Saving ${i + 1}/${names.length}...`;
                const blob = await generateBlob(names[i]);
                saveBlob(blob, `Invitation-${names[i].replace(/[^a-z0-9]/gi, '-')}.png`);
                // Wait 1 second before downloading the next so the browser doesn't block it
                await new Promise(r => setTimeout(r, 1000));
            }
            showStatus(`✅ Saved ${names.length} images!`, false);
        } catch (err) {
            showStatus('Batch save failed.');
        } finally {
            downloadAllBtn.disabled = false;
            downloadAllBtn.textContent = '⬇️ Auto-Save All';
            updatePreview(guestNameInput.value);
        }
    });

    // Initialize
    updatePreview(guestNameInput.value);
})();
</script>

</body>
</html>
